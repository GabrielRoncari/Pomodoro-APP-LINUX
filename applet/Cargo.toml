[package]
name = "foco-applet"
version = "0.1.0"
edition = "2024"
description = "Miniaplicativo do Foco para o painel do COSMIC"
license = "GPL-3.0-or-later"
repository = "https://github.com/GabrielRoncari/Pomodoro-APP-LINUX"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "process"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["applet", "applet-token", "dbus-config"]

[profile.release]
lto = "thin"
strip = true
