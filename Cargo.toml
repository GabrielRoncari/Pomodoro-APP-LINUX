[package]
name = "foco"
version = "0.1.0"
edition = "2024"
description = "Pomodoro com overlay circular, bandeja e bloqueio de sites (COSMIC/Wayland)"

[dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
tiny-skia = "0.12"
ttf-parser = "0.25"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
calloop = { version = "0.14", features = ["signals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
